{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}{% endblock %}</title>
  <link href="{% static "css/blog.css" %}" rel="stylesheet">
</head>
<body>
<header>
    <nav style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        background-color: blueviolet;
        color: antiquewhite;
    ">

        <p style="color: antiquewhite;">Logo</p>

        {% if user.is_authenticated %}
            <a href="{% url 'post:user_detail' id=user.id %}">
                <button type="button">
                    {{ user.username }}
                </button>
            </a>
        {% else %}
            <a href="{% url 'post:login' %}">
                <button type="button">
                    Login
                </button>
            </a>
        {% endif %}

    </nav>
</header>
  <div id="content">
    {% block content %}

    {% endblock %}
  </div>
  <div id="sidebar">
    <h2>My blog</h2>
    <p>This is my blog.</p>
  </div>
</body>
</html>
